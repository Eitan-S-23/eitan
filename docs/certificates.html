<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>证书 · 苏德全</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black:   #262626;
      --gray:    #8e8e8e;
      --border:  #dbdbdb;
      --bg:      #fafafa;
      --white:   #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--black);
      min-height: 100vh;
    }

    /* ── Top bar ───────────────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 200;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 935px; margin: 0 auto;
      height: 54px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
    }
    .topbar-logo {
      font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
      color: var(--black); text-decoration: none;
    }
    .topbar-back {
      font-size: 13px; color: var(--gray);
      text-decoration: none;
      display: flex; align-items: center; gap: 4px;
      transition: color .2s;
    }
    .topbar-back:hover { color: var(--black); }
    .topbar-back svg { width: 16px; height: 16px; }

    /* ── Profile ───────────────────────────────────────────────── */
    .profile {
      max-width: 935px; margin: 0 auto;
      padding: 36px 20px 28px;
      display: flex; align-items: center; gap: 48px;
    }
    .avatar-ring {
      width: 92px; height: 92px; border-radius: 50%; flex-shrink: 0;
      background: conic-gradient(
        #f9ce34 0%,
        #ee2a7b 30%,
        #6228d7 60%,
        #f9ce34 100%
      );
      padding: 3px;
    }
    .avatar-inner {
      width: 100%; height: 100%; border-radius: 50%;
      background: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
    .profile-meta { flex: 1; }
    .profile-name { font-size: 24px; font-weight: 300; margin-bottom: 14px; }
    .profile-stats {
      display: flex; gap: 36px; margin-bottom: 12px;
    }
    .stat { font-size: 14px; }
    .stat strong { font-weight: 600; }
    .stat span { color: var(--gray); margin-left: 4px; }
    .profile-bio { font-size: 14px; line-height: 1.6; color: var(--gray); }

    /* ── Filter tabs ───────────────────────────────────────────── */
    .tabs {
      max-width: 935px; margin: 0 auto;
      border-top: 1px solid var(--border);
      display: flex; justify-content: center;
    }
    .tab {
      padding: 13px 28px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--gray);
      background: none; border: none; cursor: pointer;
      border-top: 1px solid transparent;
      margin-top: -1px;
      transition: color .15s;
      display: flex; align-items: center; gap: 7px;
    }
    .tab svg { width: 13px; height: 13px; }
    .tab.active {
      color: var(--black);
      border-top-color: var(--black);
    }

    /* ── Grid ──────────────────────────────────────────────────── */
    .grid-wrap {
      max-width: 935px; margin: 4px auto 0;
      padding: 0 0 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }
    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      background: #efefef;
    }
    .cell img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }
    .cell:hover img { transform: scale(1.06); }

    .cell-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      transition: background .3s;
    }
    .cell:hover .cell-overlay { background: rgba(0,0,0,.38); }

    .cell-name {
      color: #fff;
      font-size: 13px; font-weight: 600;
      opacity: 0; transform: translateY(6px);
      transition: opacity .25s, transform .25s;
      text-align: center; padding: 0 8px;
      text-shadow: 0 1px 4px rgba(0,0,0,.4);
    }
    .cell:hover .cell-name { opacity: 1; transform: none; }

    .cell-tag {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(255,255,255,.92);
      color: var(--black);
      font-size: 10px; font-weight: 600;
      padding: 3px 9px; border-radius: 100px;
      letter-spacing: .4px;
    }

    .cell.hidden { display: none; }

    /* ── Lightbox ──────────────────────────────────────────────── */
    .lb {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,.92);
      display: none;
      align-items: center; justify-content: center;
    }
    .lb.open { display: flex; }

    .lb-close {
      position: fixed; top: 18px; right: 18px;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,.12); border: none;
      color: #fff; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .lb-close:hover { background: rgba(255,255,255,.22); }

    .lb-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,.12); border: none;
      color: #fff; font-size: 26px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
      user-select: none;
    }
    .lb-nav:hover { background: rgba(255,255,255,.22); }
    .lb-prev { left: 18px; }
    .lb-next { right: 18px; }

    .lb-body {
      max-width: 88vw; max-height: 88vh;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .lb-body img {
      max-width: 100%; max-height: 78vh;
      object-fit: contain;
      border-radius: 3px;
    }
    .lb-caption {
      color: rgba(255,255,255,.75);
      font-size: 13px; letter-spacing: .4px;
      text-align: center;
    }
    .lb-counter {
      font-size: 11px; color: rgba(255,255,255,.4);
      margin-top: 2px;
    }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .profile { gap: 24px; padding: 24px 16px 20px; }
      .avatar-ring { width: 76px; height: 76px; }
      .profile-name { font-size: 18px; }
      .profile-stats { gap: 20px; }
      .tab { padding: 12px 16px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .lb-nav { display: none; }
    }
  </style>
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="topbar-logo">苏德全</a>
    <a href="index.html" class="topbar-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      主页
    </a>
  </div>
</header>

<!-- Profile -->
<section class="profile">
  <div class="avatar-ring">
    <div class="avatar-inner">🎓</div>
  </div>
  <div class="profile-meta">
    <div class="profile-name">苏德全 &nbsp;<span style="font-size:14px;color:var(--gray)">SuDequan</span></div>
    <div class="profile-stats">
      <div class="stat"><strong id="count-all">12</strong><span>证书</span></div>
      <div class="stat"><strong>8</strong><span>竞赛</span></div>
      <div class="stat"><strong>3</strong><span>科研</span></div>
      <div class="stat"><strong>1</strong><span>语言</span></div>
    </div>
    <div class="profile-bio">济南大学 · 自动化专业 · 竞赛获奖 / 科研立项 / 语言能力</div>
  </div>
</section>

<!-- Tabs -->
<nav class="tabs">
  <button class="tab active" data-filter="all" onclick="filter('all',this)">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    全部
  </button>
  <button class="tab" data-filter="竞赛" onclick="filter('竞赛',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    竞赛
  </button>
  <button class="tab" data-filter="科研" onclick="filter('科研',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2h-4"/><path d="M9 3a3 3 0 016 0"/><path d="M9 12h6M9 16h4"/></svg>
    科研
  </button>
  <button class="tab" data-filter="语言" onclick="filter('语言',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    语言
  </button>
</nav>

<!-- Grid -->
<div class="grid-wrap">
  <div class="grid" id="grid">

    <div class="cell" data-cat="竞赛" data-idx="0" onclick="open_lb(0)">
      <img src="证书/恒拓杯.png" alt="恒拓杯" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">恒拓杯</span></div>
      <span class="cell-tag">竞赛</span>
    </div>

    <div class="cell" data-cat="竞赛" data-idx="1" onclick="open_lb(1)">
      <img src="证书/互联网+.png" alt="互联网+" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">互联网+</span></div>
      <span class="cell-tag">竞赛</span>
    </div>

    <div class="cell" data-cat="竞赛" data-idx="2" onclick="open_lb(2)">
      <img src="证书/智能制造.png" alt="智能制造" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">智能制造大赛</span></div>
      <span class="cell-tag">竞赛</span>
    </div>

    <div class="cell" data-cat="竞赛" data-idx="3" onclick="open_lb(3)">
      <img src="证书/节能减排2.png" alt="节能减排" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">节能减排（一）</span></div>
      <span class="cell-tag">竞赛</span>
    </div>

    <div class="cell" data-cat="竞赛" data-idx="4" onclick="open_lb(4)">
      <img src="证书/节能减排3.png" alt="节能减排" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">节能减排（二）</span></div>
      <span class="cell-tag">竞赛</span>
    </div>

    <div class="cell" data-cat="竞赛" data-idx="5" onclick="open_lb(5)">
      <img src="证书/三创.png" alt="三创赛" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">三创赛</span></div>
      <span class="cell-tag">竞赛</span>
    </div>

    <div class="cell" data-cat="竞赛" data-idx="6" onclick="open_lb(6)">
      <img src="证书/中国工程机器人.png" alt="中国工程机器人" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">中国工程机器人大赛</span></div>
      <span class="cell-tag">竞赛</span>
    </div>

    <div class="cell" data-cat="竞赛" data-idx="7" onclick="open_lb(7)">
      <img src="证书/电赛.jpg" alt="全国电子设计竞赛" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">全国电子设计竞赛</span></div>
      <span class="cell-tag">竞赛</span>
    </div>

    <div class="cell" data-cat="科研" data-idx="8" onclick="open_lb(8)">
      <img src="证书/科研立项1.png" alt="科研立项" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">科研立项（一）</span></div>
      <span class="cell-tag">科研</span>
    </div>

    <div class="cell" data-cat="科研" data-idx="9" onclick="open_lb(9)">
      <img src="证书/科研立项2.png" alt="科研立项" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">科研立项（二）</span></div>
      <span class="cell-tag">科研</span>
    </div>

    <div class="cell" data-cat="科研" data-idx="10" onclick="open_lb(10)">
      <img src="证书/科研立项3.png" alt="科研立项" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">科研立项（三）</span></div>
      <span class="cell-tag">科研</span>
    </div>

    <div class="cell" data-cat="语言" data-idx="11" onclick="open_lb(11)">
      <img src="证书/四级.png" alt="英语四级" loading="lazy">
      <div class="cell-overlay"><span class="cell-name">英语四级</span></div>
      <span class="cell-tag">语言</span>
    </div>

  </div>
</div>

<!-- Lightbox -->
<div class="lb" id="lb" onclick="lb_bg(event)">
  <button class="lb-close" onclick="close_lb()">✕</button>
  <button class="lb-nav lb-prev" onclick="nav(-1)">&#8249;</button>
  <div class="lb-body">
    <img id="lb-img" src="" alt="">
    <div class="lb-caption" id="lb-cap"></div>
    <div class="lb-counter" id="lb-ctr"></div>
  </div>
  <button class="lb-nav lb-next" onclick="nav(1)">&#8250;</button>
</div>

<script>
  const certs = [
    { src:'证书/恒拓杯.png',       name:'恒拓杯',           cat:'竞赛' },
    { src:'证书/互联网+.png',      name:'互联网+',          cat:'竞赛' },
    { src:'证书/智能制造.png',     name:'智能制造大赛',     cat:'竞赛' },
    { src:'证书/节能减排2.png',    name:'节能减排（一）',   cat:'竞赛' },
    { src:'证书/节能减排3.png',    name:'节能减排（二）',   cat:'竞赛' },
    { src:'证书/三创.png',         name:'三创赛',           cat:'竞赛' },
    { src:'证书/中国工程机器人.png',name:'中国工程机器人大赛',cat:'竞赛'},
    { src:'证书/电赛.jpg',         name:'全国电子设计竞赛', cat:'竞赛' },
    { src:'证书/科研立项1.png',    name:'科研立项（一）',   cat:'科研' },
    { src:'证书/科研立项2.png',    name:'科研立项（二）',   cat:'科研' },
    { src:'证书/科研立项3.png',    name:'科研立项（三）',   cat:'科研' },
    { src:'证书/四级.png',         name:'英语四级',         cat:'语言' },
  ];

  let visible = certs.map((_,i)=>i);
  let cur = 0;

  function open_lb(idx) {
    cur = idx;
    render_lb();
    document.getElementById('lb').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function render_lb() {
    const c = certs[cur];
    document.getElementById('lb-img').src = c.src;
    document.getElementById('lb-img').alt = c.name;
    document.getElementById('lb-cap').textContent = c.name + ' · ' + c.cat;
    const pos = visible.indexOf(cur);
    document.getElementById('lb-ctr').textContent =
      pos >= 0 ? (pos+1) + ' / ' + visible.length : '';
  }

  function close_lb() {
    document.getElementById('lb').classList.remove('open');
    document.body.style.overflow = '';
  }

  function lb_bg(e) {
    if (e.target === document.getElementById('lb')) close_lb();
  }

  function nav(dir) {
    const pos = visible.indexOf(cur);
    if (pos < 0) return;
    cur = visible[(pos + dir + visible.length) % visible.length];
    render_lb();
  }

  function filter(cat, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    visible = [];
    document.querySelectorAll('.cell').forEach(el => {
      const match = cat === 'all' || el.dataset.cat === cat;
      el.classList.toggle('hidden', !match);
      if (match) visible.push(parseInt(el.dataset.idx));
    });
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lb').classList.contains('open')) return;
    if (e.key === 'Escape')      close_lb();
    if (e.key === 'ArrowLeft')   nav(-1);
    if (e.key === 'ArrowRight')  nav(1);
  });
</script>
</body>
</html>
